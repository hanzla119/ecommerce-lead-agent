services:
  - type: web
    name: ecommerce-lead-outreach-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: marketingbytalha@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
