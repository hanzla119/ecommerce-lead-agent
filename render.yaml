services:
  - type: web
    name: ecommerce-lead-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
